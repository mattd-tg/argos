# Container addresses can change while nginx stays running.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream argos_web {
  zone argos_web 64k;
  server web:4001 resolve;
}

server {
  listen 443 ssl default_server;
  server_name _;
  ssl_certificate /run/argos-poc/proxy.crt;
  ssl_certificate_key /run/argos-poc/proxy.key;
  return 444;
}

server {
  listen 443 ssl;
  server_name api.argos-poc.internal;
  ssl_certificate /run/argos-poc/proxy.crt;
  ssl_certificate_key /run/argos-poc/proxy.key;
  client_max_body_size 3m;

  allow 172.30.87.2;
  deny all;

  location ^~ /v2/ {
    if ($http_upgrade != "") { return 400; }

    proxy_pass http://argos_web;
    proxy_http_version 1.1;
    proxy_set_header Host api.argos-poc.internal;
    proxy_set_header X-Forwarded-Host api.argos-poc.internal;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Protocol "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Twingate-GAT "";
    proxy_set_header Cookie "";
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
  }

  location / {
    return 404;
  }
}
