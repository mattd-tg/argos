# Container addresses can change while nginx stays running.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream argos_web {
  zone argos_web 64k;
  server web:4001 resolve;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 443 ssl default_server;
  server_name _;
  ssl_certificate /run/argos-poc/proxy.crt;
  ssl_certificate_key /run/argos-poc/proxy.key;
  return 444;
}

server {
  listen 443 ssl;
  server_name app.argos-poc.internal;
  ssl_certificate /run/argos-poc/proxy.crt;
  ssl_certificate_key /run/argos-poc/proxy.key;

  allow 172.30.87.3;
  deny all;

  location / {
    proxy_pass http://argos_web;
    proxy_http_version 1.1;
    proxy_set_header Host app.argos-poc.internal;
    proxy_set_header X-Forwarded-Host app.argos-poc.internal;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Protocol "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
}
