name: argos-poc

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

x-runtime-env: &runtime-env
  - /run/argos-poc/runtime.env

services:
  postgres:
    image: ${POSTGRES_IMAGE:?images.env must define POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?runtime.env must define POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?runtime.env must define POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?runtime.env must define POSTGRES_PASSWORD}
    volumes:
      - /srv/argos-poc/data/postgres:/var/lib/postgresql/18/docker
    networks:
      backend:
    mem_limit: 768m
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:?images.env must define REDIS_IMAGE}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /srv/argos-poc/data/redis:/data
    networks:
      backend:
    mem_limit: 256m
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: ${RABBITMQ_IMAGE:?images.env must define RABBITMQ_IMAGE}
    hostname: argos-poc-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?runtime.env must define RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?runtime.env must define RABBITMQ_DEFAULT_PASS}
    volumes:
      - /srv/argos-poc/data/rabbitmq:/var/lib/rabbitmq
    networks:
      backend:
    mem_limit: 768m
    logging: *logging
    healthcheck:
      # An early root diagnostic can create a cookie the broker cannot read.
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    image: ${ARGOS_IMAGE:?images.env must define ARGOS_IMAGE}
    pull_policy: never
    profiles: ["migrate"]
    restart: "no"
    env_file: *runtime-env
    command: ["scripts/release.sh"]
    volumes:
      - /run/argos-poc/root.crt:/run/argos-poc/root.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      backend:
    logging: *logging

  bootstrap:
    image: ${ARGOS_IMAGE:?images.env must define ARGOS_IMAGE}
    pull_policy: never
    profiles: ["operator"]
    restart: "no"
    env_file: *runtime-env
    entrypoint: []
    command: ["node", "apps/backend/dist/self-host/bin/bootstrap.js"]
    volumes:
      - /run/argos-poc/root.crt:/run/argos-poc/root.crt:ro
    networks:
      backend:
      app-egress:
    logging:
      driver: none

  web:
    image: ${ARGOS_IMAGE:?images.env must define ARGOS_IMAGE}
    pull_policy: never
    restart: unless-stopped
    env_file: *runtime-env
    command: ["./apps/backend/bin/start.sh", "web"]
    volumes:
      - /run/argos-poc/root.crt:/run/argos-poc/root.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      backend:
      app-egress:
    mem_limit: 1g
    logging: *logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''fetch("http://127.0.0.1:4001/health").then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))''',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: ${ARGOS_IMAGE:?images.env must define ARGOS_IMAGE}
    pull_policy: never
    restart: unless-stopped
    env_file: *runtime-env
    command: ["./apps/backend/bin/start.sh", "worker"]
    volumes:
      - /run/argos-poc/root.crt:/run/argos-poc/root.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      backend:
      app-egress:
    mem_limit: 2g
    logging: *logging

  connector:
    extends:
      file: ./compose.connector.yaml
      service: connector

  gateway:
    image: ${GATEWAY_IMAGE:?images.env must define GATEWAY_IMAGE}
    restart: unless-stopped
    user: "65532:65532"
    command: ["--config=/etc/argos-poc/gateway.yaml"]
    volumes:
      - ./gateway.yaml:/etc/argos-poc/gateway.yaml:ro
      - /run/argos-poc/gateway.crt:/run/argos-poc/gateway.crt:ro
      - /run/argos-poc/gateway.key:/run/argos-poc/gateway.key:ro
      - /run/argos-poc/root.crt:/run/argos-poc/root.crt:ro
    networks:
      edge:
        ipv4_address: 172.30.87.3
        aliases:
          - gateway.argos-poc.internal
    mem_limit: 256m
    logging: *logging

  app-proxy:
    image: ${NGINX_IMAGE:?images.env must define NGINX_IMAGE}
    restart: unless-stopped
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - /run/argos-poc/proxy.crt:/run/argos-poc/proxy.crt:ro
      - /run/argos-poc/proxy.key:/run/argos-poc/proxy.key:ro
    networks:
      edge:
        ipv4_address: 172.30.87.4
        aliases:
          - app.argos-poc.internal
      backend:
    mem_limit: 64m
    logging: *logging

  api-proxy:
    image: ${NGINX_IMAGE:?images.env must define NGINX_IMAGE}
    restart: unless-stopped
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - /run/argos-poc/proxy.crt:/run/argos-poc/proxy.crt:ro
      - /run/argos-poc/proxy.key:/run/argos-poc/proxy.key:ro
    networks:
      edge:
        ipv4_address: 172.30.87.5
        aliases:
          - api.argos-poc.internal
      backend:
    mem_limit: 64m
    logging: *logging

networks:
  edge:
    name: argos-poc-edge
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.87.0/24
  backend:
    name: argos-poc-backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.88.0/24
  app-egress:
    name: argos-poc-app-egress
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.90.0/24
