twingate:
  network: __TWINGATE_NETWORK__
  host: __TWINGATE_HOST__
port: 8443
metricsPort: 9090
tls:
  certificates:
    files:
      - certificateFile: /run/argos-poc/gateway.crt
        privateKeyFile: /run/argos-poc/gateway.key
webApp:
  requestHeaders:
    X-Twingate-GAT: "{{jwt}}"
upstreamTrustedCABundles:
  - file: /run/argos-poc/root.crt
