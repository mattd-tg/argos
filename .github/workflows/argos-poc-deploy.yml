name: Argos PoC deploy

permissions: {}

on:
  workflow_dispatch:

concurrency:
  group: argos-poc-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The GCP identity pool admits only main of mattd-tg/argos; upstream and
    # other forks would fail authentication anyway.
    if: github.repository_id == '1451923766' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: twingate-playground
          workload_identity_provider: projects/417269620845/locations/global/workloadIdentityPools/argos-poc-github/providers/github

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The VM's Docker uses the containerd image store, which identifies an
      # image by its manifest digest. The runner's default store uses the config
      # digest, so the VM would never find the image ID this job reports.
      - name: Use the containerd image store
        run: |
          config=/etc/docker/daemon.json
          sudo test -f "$config" || echo '{}' | sudo tee "$config" >/dev/null
          sudo jq '.features["containerd-snapshotter"] = true' "$config" | sudo tee "$config.new" >/dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker
          docker info --format '{{.DriverStatus}}' | grep -q io.containerd.snapshotter

      - name: Build image archive
        run: |
          docker build --platform linux/amd64 --target runtime --tag argos-poc:ci .
          echo "IMAGE=$(docker image inspect argos-poc:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
          # deploy.mjs accepts only archives in owner-only protected state.
          state="$HOME/.local/state/argos-poc"
          install -d -m 0700 "$state" "$state/images"
          (umask 077 && docker save argos-poc:ci | gzip > "$state/images/argos.tar.gz")

      - name: Deploy
        run: node infra/gcp/scripts/deploy.mjs ci --image "$IMAGE" --archive "$HOME/.local/state/argos-poc/images/argos.tar.gz"
